<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Camera</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            --ink: #172026;
            --muted: #5f6b73;
            --line: #d7dde2;
            --panel: #f4f7f8;
            --accent: #1f7a8c;
            --accent-dark: #155966;
            --danger: #a63446;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #edf2f4;
            color: var(--ink);
        }

        main {
            min-height: 100vh;
            padding: 14px;
        }

        header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
            margin: 0 0 12px;
        }

        h1 {
            margin: 0;
            font-size: clamp(24px, 4vw, 42px);
            line-height: 1;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .status {
            min-width: 180px;
            text-align: right;
            color: var(--muted);
            font-size: 14px;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
            gap: 14px;
            align-items: start;
        }

        .viewer,
        .details-panel {
            border: 1px solid var(--line);
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
        }

        .viewer {
            display: grid;
            grid-template-columns: 150px minmax(0, 1fr);
            min-height: 0;
        }

        .speed-rail {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            border-right: 1px solid var(--line);
            background: #ffffff;
            min-height: 0;
        }

        .rail-head {
            padding: 14px;
            border-bottom: 1px solid var(--line);
        }

        .rail-title {
            margin: 0;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
        }

        .speed-list {
            list-style: none;
            margin: 0;
            padding: 10px;
            overflow: auto;
        }

        .speed-list li + li {
            margin-top: 8px;
        }

        .speed-button {
            width: 100%;
            min-height: 50px;
            display: grid;
            align-content: center;
            gap: 4px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
            border-radius: 6px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
        }

        .speed-button:hover,
        .speed-button.active {
            border-color: var(--accent);
            background: #e9f4f6;
        }

        .speed-button strong {
            font-size: 22px;
            line-height: 1;
        }

        .speed-button span {
            color: var(--muted);
            font-size: 13px;
            line-height: 1;
        }

        .photo-area {
            display: grid;
            grid-template-rows: minmax(220px, 420px) auto;
            min-width: 0;
            min-height: 0;
        }

        .image-frame {
            min-height: 220px;
            max-height: 420px;
            background: #0f1417;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .image-frame img {
            display: block;
            width: 100%;
            height: 100%;
            max-height: 420px;
            object-fit: contain;
            cursor: zoom-in;
        }

        .photo-controls {
            display: grid;
            grid-template-columns: 54px 54px 1fr;
            gap: 8px;
            align-items: center;
            padding: 10px;
            border-top: 1px solid var(--line);
            background: #ffffff;
        }

        .photo-caption {
            color: var(--muted);
            font-size: 14px;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty {
            padding: 24px;
            color: var(--muted);
            text-align: center;
        }

        .image-frame .empty {
            color: #d6dee2;
        }

        .details-panel {
            display: grid;
            grid-template-rows: auto auto auto;
            min-height: 0;
        }

        .details-head {
            padding: 22px;
            border-bottom: 1px solid var(--line);
        }

        .summary-top {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 112px;
            gap: 16px;
            align-items: center;
        }

        .current-speed {
            margin: 0;
            font-size: clamp(52px, 7vw, 82px);
            font-weight: 700;
            line-height: 1;
        }

        .current-speed span {
            display: inline-block;
            font-size: 22px;
            color: var(--muted);
            margin-left: 6px;
        }

        .last-car-button {
            width: 112px;
            aspect-ratio: 4 / 3;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #0f1417;
            padding: 0;
            overflow: hidden;
            cursor: zoom-in;
        }

        .last-car-button img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .last-car-button .empty {
            height: 100%;
            display: grid;
            place-items: center;
            padding: 8px;
            color: #d6dee2;
            font-size: 12px;
            line-height: 1.2;
        }

        .watch-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1px;
            background: var(--line);
            border-bottom: 1px solid var(--line);
        }

        .watch-stat {
            background: #ffffff;
            padding: 12px 14px;
            min-height: 66px;
        }

        .watch-stat strong {
            display: block;
            font-size: 18px;
            line-height: 1.1;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1px;
            background: var(--line);
            overflow: auto;
        }

        .detail-item {
            background: #ffffff;
            padding: 14px 18px;
            min-height: 64px;
        }

        .label {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 6px;
        }

        .value {
            display: block;
            font-size: 16px;
            line-height: 1.3;
            word-break: break-word;
        }

        .control-panel {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            padding: 12px;
            border-top: 1px solid var(--line);
            background: var(--panel);
        }

        .control-panel button {
            font-size: 14px;
            font-weight: 600;
            min-height: 40px;
        }

        .control-panel button.danger {
            background: var(--danger);
            border-color: var(--danger);
            color: #ffffff;
        }

        .control-panel button.danger:hover {
            background: #8a2a3a;
        }

        .app-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 600;
            border-bottom: 1px solid var(--line);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #c0c0c0;
            flex-shrink: 0;
        }

        .status-dot.running {
            background: #2e8b57;
            box-shadow: 0 0 0 3px rgba(46, 139, 87, 0.25);
        }

        .status-dot.stopped {
            background: var(--danger);
            box-shadow: 0 0 0 3px rgba(166, 52, 70, 0.25);
        }

        .control-msg {
            grid-column: 1 / -1;
            font-size: 12px;
            color: var(--muted);
            min-height: 18px;
            text-align: center;
        }

        .control-msg.error {
            color: var(--danger);
        }

        .control-msg.success {
            color: #2e8b57;
        }

        .details-actions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 12px;
            border-top: 1px solid var(--line);
        }

        button {
            appearance: none;
            border: 1px solid var(--line);
            background: #ffffff;
            color: var(--ink);
            border-radius: 6px;
            padding: 0 12px;
            min-height: 44px;
            font-size: 18px;
            cursor: pointer;
        }
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 12px;
            border-top: 1px solid var(--line);
        }
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 12px;
            border-top: 1px solid var(--line);
        }

        button {
            appearance: none;
            border: 1px solid var(--line);
            background: #ffffff;
            color: var(--ink);
            border-radius: 6px;
            padding: 0 12px;
            min-height: 44px;
            font-size: 18px;
            cursor: pointer;
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
        }

        button.primary:hover {
            background: var(--accent-dark);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .error {
            color: var(--danger);
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            place-items: center;
            padding: 18px;
            background: rgba(12, 18, 22, 0.86);
        }

        .modal.open {
            display: grid;
        }

        .modal img {
            display: block;
            max-width: 96vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 6px;
            background: #111;
        }

        .modal-close {
            position: fixed;
            top: 14px;
            right: 14px;
            min-width: 44px;
            min-height: 44px;
            border-color: #ffffff;
            background: #ffffff;
            color: var(--ink);
            font-size: 24px;
            line-height: 1;
        }

        @media (max-width: 920px) {
            main {
                padding: 10px;
            }

            header,
            .layout {
                display: block;
            }

            .status {
                text-align: left;
                margin-top: 10px;
            }

            .viewer {
                min-height: 0;
            }

            .details-panel {
                margin-top: 10px;
            }
        }

        @media (max-width: 640px) {
            .viewer {
                display: flex;
                flex-direction: column-reverse;
            }

            .speed-rail {
                border-right: 0;
                border-top: 1px solid var(--line);
                max-height: 240px;
            }

            .speed-list {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }

            .speed-list li + li {
                margin-top: 0;
            }

            .photo-controls {
                grid-template-columns: 54px 54px;
            }

            .photo-caption {
                grid-column: 1 / -1;
                text-align: left;
            }
        }
        @media (max-width: 620px) {
            .summary-top {
                grid-template-columns: 1fr;
            }

            .last-car-button {
                width: 100%;
                max-width: 220px;
            }

            .watch-strip {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <div>
                <h1>Speed Camera</h1>
                <p class="subtitle">Raspberry Pi capture viewer</p>
            </div>
            <div id="status" class="status">Loading captures...</div>
        </header>

        <section class="layout">
            <div class="viewer">
                <aside class="speed-rail">
                    <div class="rail-head">
                        <p class="rail-title">Captures</p>
                    </div>
                    <ul id="speedList" class="speed-list" aria-label="Recent speeds"></ul>
                </aside>

                <div class="photo-area">
                    <div id="imageFrame" class="image-frame">
                        <div class="empty">Waiting for the first Raspberry Pi capture.</div>
                    </div>
                    <div class="photo-controls">
                        <button id="previousButton" type="button" onclick="moveSelection(1)" aria-label="Older capture">&lt;</button>
                        <button id="nextButton" type="button" onclick="moveSelection(-1)" aria-label="Newer capture">&gt;</button>
                        <div id="photoCaption" class="photo-caption">--</div>
                    </div>
                </div>
            </div>

            <aside class="details-panel">
                <div class="details-head">
                    <div class="summary-top">
                        <p class="current-speed"><span id="speedValue">--</span><span id="speedUnits"></span></p>
                        <button id="lastCarButton" class="last-car-button" type="button" onclick="showLastCarImage()" aria-label="Open last car image">
                            <span class="empty">Last car</span>
                        </button>
                    </div>
                </div>

                <div class="watch-strip" aria-label="Live watch stats">
                    <div class="watch-stat">
                        <span class="label">Fastest recent</span>
                        <strong id="fastestRecent">--</strong>
                    </div>
                    <div class="watch-stat">
                        <span class="label">Last seen</span>
                        <strong id="lastSeen">--</strong>
                    </div>
                    <div class="watch-stat">
                        <span class="label">Live count</span>
                        <strong id="liveCount">--</strong>
                    </div>
                </div>

                <div class="details-grid">
                    <div class="detail-item">
                        <span class="label">Captured</span>
                        <span id="capturedAt" class="value">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Direction</span>
                        <span id="direction" class="value">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Camera</span>
                        <span id="cameraName" class="value">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Location</span>
                        <span id="location" class="value">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Status</span>
                        <span id="captureStatus" class="value">--</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Records</span>
                        <span id="recordCount" class="value">--</span>
                    </div>
                </div>

                <div class="details-actions">
                    <button class="primary" type="button" onclick="loadCaptures()">Refresh</button>
                </div>
            </aside>
        </section>
    </main>

    <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-label="Speed camera image">
        <button class="modal-close" type="button" onclick="closeImage()" aria-label="Close image">&times;</button>
        <img id="modalImage" alt="Speed camera capture">
    </div>

    <script>
        let records = [];
        let selectedOffset = 0;
        let selectedRecord = null;
        let liveImageUrl = 'http://192.168.2.191/speed-camera/live.jpg';
        let liveMode = true;
        let liveTimer = null;

        function text(id, value) {
            document.getElementById(id).textContent = value || '--';
        }

        function speedLabel(record) {
            if (!record || record.ave_speed === null) {
                return '--';
            }

            return Number(record.ave_speed).toFixed(1);
        }

        function monthDay(value) {
            if (!value) {
                return '--';
            }

            const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (match) {
                return Number(match[2]) + '/' + Number(match[3]);
            }

            return String(value).slice(0, 5);
        }

        function timeOnly(value) {
            if (!value) {
                return '--';
            }

            const match = String(value).match(/(\d{2}):(\d{2})(?::\d{2})?/);
            if (match) {
                return match[1] + ':' + match[2];
            }

            return monthDay(value);
        }

        function updateLastCar(record) {
            const button = document.getElementById('lastCarButton');
            button.innerHTML = '';

            if (!record || !record.image_url) {
                const empty = document.createElement('span');
                empty.className = 'empty';
                empty.textContent = 'Last car';
                button.appendChild(empty);
                button.disabled = true;
                return;
            }

            const img = new Image();
            img.alt = 'Last car that passed the speed camera';
            img.src = record.image_url;
            button.disabled = false;
            button.appendChild(img);
        }

        function updateWatchStats(sourceRecord) {
            const recent = records.filter(function (record) {
                return record && record.ave_speed !== null && !Number.isNaN(Number(record.ave_speed));
            });
            const fastest = recent.reduce(function (best, record) {
                return !best || Number(record.ave_speed) > Number(best.ave_speed) ? record : best;
            }, null);

            text('fastestRecent', fastest ? speedLabel(fastest) + ' ' + (fastest.speed_units || '') : '--');
            text('lastSeen', timeOnly(sourceRecord && sourceRecord.log_timestamp));
            text('liveCount', records.length || '--');
        }

        function showImage(url, altText) {
            const frame = document.getElementById('imageFrame');
            frame.innerHTML = '';

            if (!url) {
                frame.innerHTML = '<div class="empty">This record does not include an image.</div>';
                return;
            }

            const img = new Image();
            img.alt = altText || 'Speed camera capture';
            img.onload = function () {
                frame.innerHTML = '';
                frame.appendChild(img);
            };
            img.onerror = function () {
                frame.innerHTML = '<div class="empty error">Image file was not found on this web server.</div>';
            };
            img.onclick = showSelectedImage;
            img.src = url;
        }

        function showLiveImage() {
            const frame = document.getElementById('imageFrame');
            let img = frame.querySelector('img');

            if (!img || img.dataset.live !== 'true') {
                frame.innerHTML = '';
                img = new Image();
                img.dataset.live = 'true';
                img.alt = 'Live speed camera feed';
                img.onclick = showSelectedImage;
                img.onerror = function () {
                    frame.innerHTML = '<div class="empty error">Live camera image was not available.</div>';
                };
                frame.appendChild(img);
            }

            img.src = liveImageUrl + '?t=' + Date.now();
        }

        function startLiveImage() {
            liveMode = true;
            showLiveImage();
            if (!liveTimer) {
                liveTimer = setInterval(showLiveImage, 1000);
            }
        }

        function stopLiveImage() {
            liveMode = false;
            if (liveTimer) {
                clearInterval(liveTimer);
                liveTimer = null;
            }
        }

        function renderList() {
            const list = document.getElementById('speedList');
            list.innerHTML = '';

            records.forEach(function (record) {
                const item = document.createElement('li');
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'speed-button' + (record.offset === selectedOffset ? ' active' : '');
                button.onclick = function () {
                    renderRecord(record);
                    showSelectedImage();
                };

                const speed = document.createElement('strong');
                speed.textContent = speedLabel(record);

                const date = document.createElement('span');
                date.textContent = monthDay(record.log_timestamp);

                button.appendChild(speed);
                button.appendChild(date);
                item.appendChild(button);
                list.appendChild(item);
            });
        }

        function updateNavigation() {
            const index = records.findIndex(function (record) {
                return record.offset === selectedOffset;
            });

            document.getElementById('previousButton').disabled = index < 0 || index >= records.length - 1;
            document.getElementById('nextButton').disabled = index <= 0;
        }

        function renderRecord(data) {
            selectedRecord = data;
            selectedOffset = data.offset || 0;
            const latestRecord = records[0] || data;
            text('speedValue', speedLabel(data));
            text('speedUnits', data.speed_units);
            text('capturedAt', data.log_timestamp);
            text('cameraName', data.camera);
            text('direction', data.direction);
            text('location', data.cam_location);
            text('captureStatus', data.status);
            text('photoCaption', data.log_timestamp);
            updateLastCar(latestRecord);
            updateWatchStats(latestRecord);
            showImage(data.image_url, 'Speed camera capture');
            if (data.image_url) {
                stopLiveImage();
            }
            document.getElementById('status').className = 'status';
            document.getElementById('status').textContent = selectedOffset === 0 ? 'Showing latest capture' : 'Showing older capture';
            renderList();
            updateNavigation();
        }

        function renderLiveData(data) {
            records = data.records || [];
            selectedRecord = data.records && data.records.length ? data.records[0] : data;
            selectedOffset = 0;
            liveImageUrl = data.live_image_url || liveImageUrl;

            text('recordCount', records.length || '--');
            text('speedValue', speedLabel(data));
            text('speedUnits', data.speed_units);
            text('capturedAt', data.log_timestamp);
            text('cameraName', data.camera || (data.details && data.details.Camera));
            text('direction', data.direction || (data.details && data.details.Stream));
            text('location', data.cam_location || (data.details && data.details.Host));
            text('captureStatus', data.status || 'live feed');
            text('photoCaption', 'Live camera feed');
            updateLastCar(selectedRecord);
            updateWatchStats(selectedRecord);
            document.getElementById('status').className = 'status';
            document.getElementById('status').textContent = 'Live feed with latest data';
            renderList();
            updateNavigation();
            startLiveImage();
        }

        function renderError(message) {
            document.getElementById('status').className = 'status error';
            document.getElementById('status').textContent = message;
        }

        function loadCaptures() {
            fetch('live-status.php', { cache: 'no-store' })
                .then(function (response) {
                    return response.json().then(function (data) {
                        if (!response.ok || !data.ok) {
                            throw new Error(data.error || 'Unable to load speed data.');
                        }
                        return data;
                    });
                })
                .then(renderLiveData)
                .catch(function () {
                    fetch('getspeed.php?limit=30', { cache: 'no-store' })
                        .then(function (response) {
                            return response.json().then(function (data) {
                                if (!response.ok || !data.ok) {
                                    throw new Error(data.error || 'Unable to load speed data.');
                                }
                                return data;
                            });
                        })
                        .then(function (data) {
                            records = data.records || [data];
                            text('recordCount', records.length);
                            renderRecord(records[0]);
                        })
                        .catch(function (error) {
                            renderError(error.message);
                        });
                });
        }

        function moveSelection(step) {
            const index = records.findIndex(function (record) {
                return record.offset === selectedOffset;
            });
            const nextIndex = index + step;

            if (nextIndex < 0 || nextIndex >= records.length) {
                return;
            }

            renderRecord(records[nextIndex]);
        }

        function showSelectedImage() {
            const url = liveMode ? liveImageUrl + '?t=' + Date.now() : selectedRecord && selectedRecord.image_url;
            if (!url) {
                return;
            }

            const modal = document.getElementById('imageModal');
            const image = document.getElementById('modalImage');
            image.src = url;
            modal.classList.add('open');
        }

        function showLastCarImage() {
            const latestRecord = records[0] || selectedRecord;
            if (!latestRecord || !latestRecord.image_url) {
                return;
            }

            const modal = document.getElementById('imageModal');
            const image = document.getElementById('modalImage');
            image.src = latestRecord.image_url;
            modal.classList.add('open');
        }

        function closeImage() {
            document.getElementById('imageModal').classList.remove('open');
        }

        document.getElementById('imageModal').addEventListener('click', function (event) {
            if (event.target.id === 'imageModal') {
                closeImage();
            }
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeImage();
            }
        });

        loadCaptures();
        setInterval(loadCaptures, 5000);
    </script>
</body>

</html>
